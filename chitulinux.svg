<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="resin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38d6c4"/>
      <stop offset="1" stop-color="#1a8f9e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- build plate and its arm -->
  <rect x="122" y="34" width="12" height="46" rx="3" fill="#9aa8c4"/>
  <rect x="68" y="76" width="120" height="14" rx="4" fill="#c9d3e6"/>
